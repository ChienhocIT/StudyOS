components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        details:
          type: object
          additionalProperties: true
    PageMeta:
      type: object
      properties:
        nextCursor:
          type:
          - string
          - 'null'
        hasMore:
          type: boolean
    User:
      type: object
      required:
      - id
      - email
      - displayName
      - locale
      - timezone
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        locale:
          type: string
        timezone:
          type: string
    TokenPair:
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresIn
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Seconds
    AuthResponse:
      type: object
      required:
      - user
      - tokens
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/TokenPair'
    Workspace:
      type: object
      required:
      - id
      - name
      - role
      - plan
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum:
          - OWNER
          - ADMIN
          - MEMBER
        plan:
          type: string
          enum:
          - FREE
          - PRO
          - TEAM
    Notebook:
      type: object
      required:
      - id
      - workspaceId
      - title
      - status
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        goalText:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Source:
      type: object
      required:
      - id
      - notebookId
      - type
      - status
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        notebookId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - PDF
          - WEB
          - YOUTUBE
          - RAW_TEXT
          - DOCX
          - PPTX
          - AUDIO
          - IMAGE
        title:
          type:
          - string
          - 'null'
        canonicalUri:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - CREATED
          - UPLOADING
          - QUEUED
          - PARSING
          - NORMALIZED
          - CHUNKING
          - EMBEDDING
          - ENRICHING
          - READY
          - FAILED
          - DELETING
          - DELETED
        progress:
          type: integer
          minimum: 0
          maximum: 100
        failureCode:
          type:
          - string
          - 'null'
        retryable:
          type: boolean
        createdAt:
          type: string
          format: date-time
    UploadInitResponse:
      type: object
      required:
      - source
      - uploadUrl
      - expiresAt
      properties:
        source:
          $ref: '#/components/schemas/Source'
        uploadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
    Job:
      type: object
      required:
      - id
      - type
      - status
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
        progress:
          type: integer
          minimum: 0
          maximum: 100
        resultRef:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
    Conversation:
      type: object
      required:
      - id
      - notebookId
      - mode
      properties:
        id:
          type: string
          format: uuid
