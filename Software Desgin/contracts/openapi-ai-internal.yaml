                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "ArtifactRequest": {
        "properties": {
          "context": {
            "$ref": "#/components/schemas/InternalContext"
          },
          "artifactType": {
            "type": "string",
            "enum": [
              "QUIZ",
              "FLASHCARDS",
              "STUDY_GUIDE"
            ],
            "title": "Artifacttype"
          },
          "options": {
            "additionalProperties": true,
            "type": "object",
            "title": "Options"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "context",
          "artifactType"
        ],
        "title": "ArtifactRequest"
      },
      "ChatRequest": {
        "properties": {
          "context": {
            "$ref": "#/components/schemas/InternalContext"
          },
          "requestId": {
            "type": "string",
            "format": "uuid",
            "title": "Requestid"
          },
          "messageId": {
            "type": "string",
            "format": "uuid",
            "title": "Messageid"
          },
          "content": {
            "type": "string",
            "maxLength": 16000,
            "minLength": 1,
            "title": "Content"
          },
          "mode": {
            "type": "string",
            "enum": [
              "ASK",
              "SOCRATIC",
              "FEYNMAN",
              "EXAM"
            ],
            "title": "Mode",
            "default": "ASK"
          },
          "history": {
            "items": {
              "$ref": "#/components/schemas/HistoryMessage"
            },
            "type": "array",
            "maxItems": 20,
            "title": "History"
          },
          "learnerState": {
            "additionalProperties": true,
            "type": "object",
            "title": "Learnerstate"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "context",
          "requestId",
          "messageId",
          "content"
        ],
        "title": "ChatRequest"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "HistoryMessage": {
        "properties": {
          "role": {
            "type": "string",
            "enum": [
              "user",
              "assistant",
              "USER",
              "ASSISTANT"
            ],
            "title": "Role"
          },
          "content": {
            "type": "string",
            "maxLength": 16000,
            "title": "Content"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "role",
          "content"
        ],
        "title": "HistoryMessage"
      },
      "InternalContext": {
        "properties": {
          "userId": {
            "type": "string",
            "format": "uuid",
            "title": "Userid"
          },
          "workspaceId": {
            "type": "string",
            "format": "uuid",
            "title": "Workspaceid"
          },
          "notebookId": {
            "type": "string",
            "format": "uuid",
            "title": "Notebookid"
          },
          "sourceIds": {
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "type": "array",
            "maxItems": 100,
            "title": "Sourceids"
          },
          "conversationId": {
            "anyOf": [
              {
                "type": "string",
                "format": "uuid"
              },
              {
                "type": "null"
              }
            ],
            "title": "Conversationid"
          },
          "traceId": {
            "type": "string",
            "maxLength": 64,
            "minLength": 1,
            "pattern": "^[A-Za-z0-9_-]+$",
            "title": "Traceid"
          },
          "permissions": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "maxItems": 20,
            "minItems": 1,
            "title": "Permissions"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "userId",
          "workspaceId",
          "notebookId",
          "sourceIds",
          "traceId",
          "permissions"
        ],
        "title": "InternalContext"
      },
      "LanguageRequest": {
        "properties": {
          "context": {
            "$ref": "#/components/schemas/InternalContext"
          },
          "sentence": {
            "type": "string",
            "maxLength": 5000,
            "minLength": 1,
            "title": "Sentence"
          },
          "sourceLanguage": {
            "type": "string",
            "maxLength": 16,
            "title": "Sourcelanguage",
            "default": "en"
          },
          "targetLanguage": {
            "type": "string",
            "maxLength": 16,
            "title": "Targetlanguage",
            "default": "vi"
          },
          "learnerLevel": {
            "type": "string",
            "enum": [
              "A1",
              "A2",
              "B1",
              "B2",
              "C1",
              "C2"
            ],
            "title": "Learnerlevel",
            "default": "B1"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "context",
          "sentence"
        ],
        "title": "LanguageRequest"
      },
      "RetrievalRequest": {
        "properties": {
          "context": {
            "$ref": "#/components/schemas/InternalContext"
          },
          "query": {
            "type": "string",
            "maxLength": 4000,
            "minLength": 1,
            "title": "Query"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "context",
          "query"
        ],
        "title": "RetrievalRequest"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      }
    }
  }
}