[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "studyos-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["studyos-ai-core", "aio-pika>=9.5,<10"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.uv.sources]
studyos-ai-core = { path = "../../packages/python-ai-core", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
