[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "studyos-ai-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "PyJWT>=2.10,<3", "psycopg[binary,pool]>=3.2,<4", "pypdf>=5.3,<7", "beautifulsoup4>=4.13,<5", "boto3>=1.36,<2", "opentelemetry-api>=1.30,<2", "prometheus-client>=0.21,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/studyos_ai"]
