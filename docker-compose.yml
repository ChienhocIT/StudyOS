name: studyos
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyos}
      POSTGRES_USER: ${POSTGRES_USER:-studyos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-studyos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/setup.ps1 first}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-studyos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/setup.ps1 first}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-studyos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-studyos-sources}
    entrypoint: ["/bin/sh", "-ec"]
    volumes: ["./infrastructure/minio/lifecycle.json:/etc/studyos/lifecycle.json:ro"]
    command:
      - 'mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null; mc mb --ignore-existing "local/$${S3_BUCKET}"; mc anonymous set none "local/$${S3_BUCKET}"; mc ilm import "local/$${S3_BUCKET}" < /etc/studyos/lifecycle.json'
  core-api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-studyos}
      DATABASE_USERNAME: ${POSTGRES_USER:-studyos}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-studyos}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      AI_INTERNAL_URL: http://ai-service:8000
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-studyos}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-studyos-sources}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 25
  ai-service:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    environment:
      DATABASE_READ_URL: postgresql://${POSTGRES_USER:-studyos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studyos}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-local-extractive}
      MODEL_PROVIDER_API_KEY: ${MODEL_PROVIDER_API_KEY:-}
      MODEL_PROVIDER_BASE_URL: ${MODEL_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      core-api: {condition: service_healthy}
  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_DERIVED_DATA_URL: postgresql://${POSTGRES_USER:-studyos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studyos}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-studyos}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      AI_INTERNAL_URL: http://ai-service:8000
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-studyos}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-studyos-sources}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-local-extractive}
      MODEL_PROVIDER_API_KEY: ${MODEL_PROVIDER_API_KEY:-}
      MODEL_PROVIDER_BASE_URL: ${MODEL_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    depends_on:
      core-api: {condition: service_healthy}
      ai-service: {condition: service_started}
  web:
    profiles: [app]
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      core-api: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
